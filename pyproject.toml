[project]
name = "goodwoolf"
version = "0.1.0"
description = "Building foundation models collaboratively on commodity hardware."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=5.2.0",
    "huggingface-hub>=2.4.0",
    "numpy>=2.2.6",
    "rustbpe>=0.1.0",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["goodwoolf", "goodwoolf.*"]
# enable folders as packages without __init__ files
namespaces = true

# build dist package with non-python files
[tool.setuptools.package-data]
goodwoolf = [
    "models/**/config/*.json",
    "models/**/config/*.jinja",
    "models/**/config/*.yaml",
    "models/**/config/*.pkl",
    "models/**/config/*.pt",
]

[project.optional-dependencies]
publish = [
    "twine>=7.0.0",
    "wheel>=0.48.0",
]

[project.scripts]
goodwoolf = "goodwoolf.main:main"
gw = "goodwoolf.main:main"
